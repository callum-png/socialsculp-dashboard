<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialSculp - Preview</title>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel Standalone for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Arial, sans-serif;
            color: #008cff;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="loading">Loading SocialSculp...</div>

    <script>
        // Load and transform the JSX file
        fetch('viralnation-mvp.jsx')
            .then(response => response.text())
            .then(jsxCode => {
                document.getElementById('loading').textContent = 'Compiling JSX...';
                
                // Replace import statement with React destructuring from global React
                // Since React is loaded via CDN as UMD, React is available globally
                // Match: import React, { useState, useEffect, useRef } from 'react';
                // Replace with: const { useState, useEffect, useRef } = React;
                modifiedCode = jsxCode.replace(
                    /^import\s+(?:React\s*,)?\s*\{([^}]+)\}\s+from\s+['"]react['"];?\s*\n?/gm,
                    (match, destructured) => {
                        if (destructured) {
                            // Extract and clean the destructured imports
                            const imports = destructured
                                .split(',')
                                .map(i => i.trim())
                                .filter(Boolean)
                                .join(', ');
                            return `const { ${imports} } = React;\n`;
                        }
                        return '';
                    }
                );
                
                // Also handle: import React from 'react';
                modifiedCode = modifiedCode.replace(/^import\s+React\s+from\s+['"]react['"];?\s*\n?/gm, '');
                
                // Replace export default with window assignment BEFORE Babel transformation
                // This ensures Babel doesn't transform it in a way that breaks our assignment
                modifiedCode = modifiedCode.replace(
                    /export\s+default\s+function\s+SocialSculpMVP\s*\(/g,
                    'window.SocialSculpMVP = function SocialSculpMVP('
                );
                
                // Remove any remaining export default
                modifiedCode = modifiedCode.replace(/export\s+default\s*/g, '');
                
                console.log('Preparing code for Babel transformation...');
                
                // Show progress
                let progressInterval = setInterval(() => {
                    const loadingEl = document.getElementById('loading');
                    if (loadingEl && loadingEl.textContent.includes('Compiling')) {
                        loadingEl.textContent += '.';
                    }
                }, 500);
                
                // Transform with Babel
                try {
                    const transformedCode = Babel.transform(modifiedCode, {
                        presets: ['react'],
                        plugins: []
                    }).code;
                    
                    clearInterval(progressInterval);
                    
                    // Verify window.SocialSculpMVP exists in transformed code
                    if (!transformedCode.includes('window.SocialSculpMVP')) {
                        console.error('⚠ window.SocialSculpMVP not found in transformed code');
                        // Try to add it manually at the end
                        const fixedCode = transformedCode + '\nif (typeof SocialSculpMVP !== "undefined" && !window.SocialSculpMVP) { window.SocialSculpMVP = SocialSculpMVP; }';
                        executeCode(fixedCode);
                    } else {
                        console.log('✓ window.SocialSculpMVP found in transformed code');
                        executeCode(transformedCode);
                    }
                    
                } catch (babelError) {
                    clearInterval(progressInterval);
                    throw new Error(`Babel transformation failed: ${babelError.message}`);
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('root').innerHTML = `
                    <div style="padding: 40px; color: red; font-family: Arial;">
                        <h2>Error Loading Component</h2>
                        <p>${error.message}</p>
                        <button onclick="location.reload()" style="padding: 10px 20px; margin-top: 20px; cursor: pointer; background: #008cff; color: white; border: none; border-radius: 4px;">Reload</button>
                    </div>
                `;
            });
        
        function executeCode(code) {
            document.getElementById('loading').textContent = 'Executing component...';
            
            // Register GSAP plugins
            if (window.gsap && window.ScrollTrigger) {
                window.gsap.registerPlugin(window.ScrollTrigger);
            }
            
            // Create a script tag and execute
            const script = document.createElement('script');
            script.text = code;
            
            // Add error handler
            const errorHandler = (event) => {
                console.error('Execution error:', event.error || event.message);
            };
            
            window.addEventListener('error', errorHandler, true);
            
            try {
                document.body.appendChild(script);
                console.log('✓ Script executed');
                
                // Wait a bit then try to render
                setTimeout(() => {
                    window.removeEventListener('error', errorHandler, true);
                    renderComponent();
                }, 500);
                
            } catch (execError) {
                window.removeEventListener('error', errorHandler, true);
                throw new Error(`Execution failed: ${execError.message}`);
            }
        }
        
        function renderComponent() {
            let attempts = 0;
            const maxAttempts = 30;
            
            const tryRender = () => {
                attempts++;
                
                if (typeof window.SocialSculpMVP !== 'undefined') {
                    document.getElementById('loading').style.display = 'none';
                    
                    try {
                        const root = ReactDOM.createRoot(document.getElementById('root'));
                        root.render(React.createElement(window.SocialSculpMVP));
                        console.log('✓ Component rendered successfully');
                    } catch (renderError) {
                        console.error('Render error:', renderError);
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('root').innerHTML = `
                            <div style="padding: 40px; color: red; font-family: Arial;">
                                <h2>Render Error</h2>
                                <p>${renderError.message}</p>
                                <button onclick="location.reload()" style="padding: 10px 20px; margin-top: 20px; cursor: pointer; background: #008cff; color: white; border: none; border-radius: 4px;">Reload</button>
                            </div>
                        `;
                    }
                } else if (attempts < maxAttempts) {
                    document.getElementById('loading').textContent = `Executing component... (${attempts}/${maxAttempts})`;
                    setTimeout(tryRender, 300);
                } else {
                    // Final attempt - check what's available
                    console.error('Component still not found after', maxAttempts, 'attempts');
                    console.error('Available on window:', Object.keys(window).filter(k => k.toLowerCase().includes('social')));
                    
                    // Try to manually find and assign
                    try {
                        if (typeof SocialSculpMVP !== 'undefined') {
                            window.SocialSculpMVP = SocialSculpMVP;
                            console.log('✓ Found component without window prefix, assigned it');
                            renderComponent();
                            return;
                        }
                    } catch (e) {}
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('root').innerHTML = `
                        <div style="padding: 40px; color: red; font-family: Arial;">
                            <h2>Component Not Found</h2>
                            <p>Could not find SocialSculpMVP component after execution.</p>
                            <p>Please check the browser console (F12) for errors.</p>
                            <button onclick="location.reload()" style="padding: 10px 20px; margin-top: 20px; cursor: pointer; background: #008cff; color: white; border: none; border-radius: 4px;">Reload</button>
                        </div>
                    `;
                }
            };
            
            tryRender();
        }
    </script>
</body>
</html>
