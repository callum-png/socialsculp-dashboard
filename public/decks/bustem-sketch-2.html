<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 675px; overflow: hidden; background: #000; }

    .thumb {
      position: relative;
      width: 1200px;
      height: 675px;
      background: #080608;
      overflow: hidden;
    }

    /* Subtle texture background */
    .bg-photo {
      position: absolute;
      inset: 0;
      background-image: url('file:///C:/Users/Cal/Pictures/Screenshots/Screenshot 2026-03-05 150000.png');
      background-size: cover;
      background-position: center top;
      filter: brightness(0.15) saturate(0.2) sepia(0.5);
    }

    /* Mugshot frame — the "lineup" */
    .lineup-frame {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 460px;
      height: 440px;
      border: 4px solid rgba(255,200,0,0.5);
      background-image: url('file:///C:/Users/Cal/Pictures/Screenshots/Screenshot 2026-03-05 150000.png');
      background-size: cover;
      background-position: center top;
      filter: grayscale(0.7) brightness(0.8);
    }

    /* Height ruler on the side of the lineup */
    .ruler {
      position: absolute;
      top: 60px;
      left: calc(50% - 230px - 36px);
      width: 30px;
      height: 440px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0 0;
    }
    .ruler-mark {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,200,0,0.6);
      letter-spacing: 1px;
      text-align: right;
    }

    /* COUNTERFEIT stamp */
    .stamp {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-22deg);
      font-family: 'Anton', sans-serif;
      font-size: 96px;
      color: rgba(255, 30, 30, 0.92);
      border: 8px solid rgba(255, 30, 30, 0.85);
      padding: 8px 20px;
      letter-spacing: 4px;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: none;
      line-height: 1;
    }

    /* Bottom text */
    .bottom {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .bottom-headline {
      font-family: 'Anton', sans-serif;
      font-size: 72px;
      color: #fff;
      text-transform: uppercase;
      line-height: 0.9;
      letter-spacing: 1px;
    }

    .bottom-sub {
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Crime tape strips */
    .tape {
      position: absolute;
      height: 36px;
      left: -20px;
      right: -20px;
      background: repeating-linear-gradient(
        -45deg,
        #ffd700,
        #ffd700 20px,
        #111 20px,
        #111 40px
      );
      opacity: 0.18;
    }
    .tape-top { top: 50px; }
    .tape-bot { bottom: 130px; }
  </style>
</head>
<body>
<div class="thumb">
  <div class="bg-photo"></div>
  <div class="tape tape-top"></div>
  <div class="tape tape-bot"></div>

  <div class="lineup-frame"></div>

  <div class="ruler">
    <div class="ruler-mark">6'</div>
    <div class="ruler-mark">5'</div>
    <div class="ruler-mark">4'</div>
    <div class="ruler-mark">3'</div>
  </div>

  <div class="stamp">COUNTERFEIT</div>

  <div class="bottom">
    <div class="bottom-headline">We Found It.<br>We Killed It.</div>
    <div class="bottom-sub">Bustem AI — Brand Protection</div>
  </div>
</div>
</body>
</html>
